name: Bug report
description: 报告可公开复现的功能问题；安全问题请使用私密安全报告。
title: '[Bug] '
labels: ['bug']
body:
  - type: dropdown
    id: host
    attributes:
      label: 主机平台
      options: [macOS Apple Silicon, macOS Intel, Windows 11, Windows 10, Android, Node.js 开发模式]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Band Room 版本
      placeholder: 例如 1.0.2
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请勿上传受版权保护的曲谱、主机凭证或个人信息。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期与实际结果
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: 已脱敏诊断信息
